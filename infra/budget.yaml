AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Monthly cost budget with email alerts for the ParkEase account. Create this FIRST.
  Budgets only alert; they do not stop spending. Deploy in us-east-1.

Parameters:
  Email:
    Type: String
    Description: Address that receives budget alerts
  MonthlyLimitUsd:
    Type: Number
    Default: 5

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: parkease-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyLimitUsd, Unit: USD }
        # Count usage before credits are applied, so alerts fire even while credits pay the bill.
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 20, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref Email }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref Email }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref Email }]
